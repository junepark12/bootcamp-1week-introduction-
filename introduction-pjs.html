<!DOCTYPE html><!-- HTML를 사용한다고 선언-->


<html lnag="ko"><!--hmtl 내에서 언어 설정 ko(한국어로 설정)-->

<head>

    <meta charset="UTF-8"><!--문서의 문자 인코딩 설정-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><!-- 웹 페이지 관련-->
    <title> Introduction</title><!--문서 제목-->

<body>
    <h1>안녕하세요, 저는 박준서입니다.</h1><!--제목 설정-->

        <li>java</li><!-- 리스트 아이템 2-->
        <li>SQL</li><!-- 리스트 아이템 3-->
    </ul>

            <tr><!--두 번째 행-->
